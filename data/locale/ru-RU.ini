# Страница поддержки
SupportTitle="Поддержка команды Aitum"
SupportText="Aitum Stream Suite разрабатывается и поддерживается командой Aitum абсолютно бесплатно для <u>вас — стриминг-сообщества</u>.<br /><br />Ваша помощь жизненно необходима, чтобы мы продолжали создавать полезные инструменты, помогающие авторам делать качественный контент.<br /><br />Если наши плагины помогли вам упростить работу, вырастить канал или вдохновили начать стримить — пожалуйста, поддержите наш проект.<br /><br /><strong><a href='https://aitum.tv/support-us'>Поддержать команду Aitum</a></strong>"

# Страница справки
HelpTitle="Помощь по Aitum Stream Suite"
HelpText="Поскольку Aitum Stream Suite — относительно новый инструмент, мы продолжаем собирать обратную связь и исправлять редкие неполадки.<br /><br />В будущих обновлениях появится прямая ссылка на подробное интерактивное руководство по устранению ошибок.<br /><br />А пока — <strong><a href='https://aitum.tv/discord'>заходите в наш Discord, чтобы обсудить плагин или сообщить о баге!</a></strong>"

